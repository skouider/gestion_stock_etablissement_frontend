<div class="max-w-2xl mx-auto p-6 bg-white rounded-xl shadow-md">
  <h2 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
    <i class="fa-solid fa-qrcode text-indigo-600"></i> Scan & Mouvement de Stock
  </h2>

  <!-- Erreur de scan -->
  <div *ngIf="errorMessage" class="mb-4 p-4 bg-red-100 text-red-700 rounded-lg flex items-center gap-2">
    <i class="fa-solid fa-circle-exclamation"></i> {{ errorMessage }}
  </div>

  <!-- ÉTAPE 1 : Scanner QR Code -->
  <div *ngIf="isScanning" class="flex flex-col items-center">
    <zxing-scanner 
      [formats]="allowedFormats"
      (scanSuccess)="onScanSuccess($event)"
      class="w-full max-w-md h-64 overflow-hidden rounded-lg border-2 border-dashed border-indigo-400">
    </zxing-scanner>
    <p class="mt-3 text-sm text-gray-500">Pointez la caméra vers le QR Code de l'article</p>
  </div>

  <!-- ÉTAPE 2 : Formulaire de mouvement -->
  <div *ngIf="!isScanning && article">
    <app-mouvement-form 
      [article]="article" 
      (mouvementValide)="resetWorkflow()" 
      (annuler)="terminerSession()"> <!-- Fait appel à terminerSession() -->
    </app-mouvement-form>
  </div>

  <!-- ÉTAPE 3 : Écran de fin de session (Si aucune redirection n'est configurée) -->
  <div *ngIf="!isScanning && !article" class="text-center py-8 space-y-4">
    <div class="p-4 bg-green-50 text-green-600 rounded-full w-16 h-16 mx-auto flex items-center justify-center text-2xl">
      <i class="fa-solid fa-check"></i>
    </div>
    <h3 class="text-lg font-bold text-gray-800">Session de scan terminée</h3>
    <button 
      (click)="resetWorkflow()" 
      class="px-6 py-2.5 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 transition-colors">
      <i class="fa-solid fa-qrcode mr-2"></i> Lancer une nouvelle session
    </button>
  </div>

</div>
