<div class="scan-page">

  <!-- Erreur générale -->
  <div *ngIf="erreur" class="error-card">
    {{ erreur }}
  </div>

  <!-- Article trouvé -->
  <div *ngIf="article" class="movement-card">

    <!-- En-tête -->
    <div class="header">
      <div class="header-icon">📦</div>

      <div>
        <h1>Enregistrer un mouvement</h1>
        <p>Mise à jour du stock</p>
      </div>
    </div>

    <!-- Informations article -->
    <div class="article-card">

      <!-- INFORMATIONS -->
      <div class="article-details">

        <div class="article-info">
          <span>Code article</span>
          <strong>{{ article.code }}</strong>
        </div>

        <div class="article-info">
          <span>Désignation</span>
          <strong>{{ article.nom }}</strong>
        </div>

        <div class="stock-info">
          <span>Stock actuel</span>
          <strong>{{ article.quantite }} unités</strong>
        </div>

      </div>


      <!-- PHOTO -->
      <div class="article-photo">

        <img *ngIf="imageArticleUrl" [src]="imageArticleUrl" [alt]="article.nom" />

        <div *ngIf="!imageArticleUrl" class="no-photo">

          📦

        </div>

      </div>

    </div>

    <!-- Formulaire -->
    <form #form="ngForm" (ngSubmit)="valider()">

      <!-- Type de mouvement -->
      <div class="form-group">

        <label>Type d'opération</label>

        <div class="type-buttons">

          <button type="button" class="type-button entree" [class.active]="typeMouvement === TypeMouvementStock.ENTREE"
            (click)="setType(TypeMouvementStock.ENTREE)">

            ↓ Entrée

          </button>

          <button type="button" class="type-button sortie" [class.active]="typeMouvement === TypeMouvementStock.SORTIE"
            (click)="setType(TypeMouvementStock.SORTIE)">

            ↑ Sortie

          </button>

        </div>

      </div>

      <!-- Quantité -->
      <div class="form-group">

        <label for="quantite">
          Quantité
        </label>

        <input id="quantite" type="number" name="quantite" [(ngModel)]="quantite" min="1" required class="form-input">

      </div>

      <!-- Département pour une sortie -->
      <div *ngIf="typeMouvement === TypeMouvementStock.SORTIE" class="form-group">

        <label for="departement">
          Département concerné
        </label>

        <input id="departement" type="text" name="departement" [(ngModel)]="departement" required
          placeholder="Ex : Cuisine, Maintenance..." class="form-input">

      </div>

      <!-- Message erreur -->
      <div *ngIf="erreur" class="form-error">

        {{ erreur }}

      </div>

      <!-- Boutons -->
      <div class="action-buttons">

        <button type="button" class="btn-secondary" (click)="article = null">

          Annuler

        </button>

        <button type="submit" class="btn-primary" [disabled]="!form.valid || isSubmitting">

          {{ isSubmitting ? 'Enregistrement...' : '✓ Valider' }}

        </button>

      </div>

    </form>

  </div>


  <!-- Recherche de l'article -->
  <div *ngIf="!article && !erreur" class="loading-card">

    <div class="spinner"></div>

    <h2>
      Recherche de l'article...
    </h2>

    <p>
      {{ codeArticle }}
    </p>

  </div>

</div>
