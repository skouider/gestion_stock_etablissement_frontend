<div class="bg-white rounded-xl shadow-md p-6 max-w-xl mx-auto">

  <div class="flex items-center gap-3 border-b pb-4 mb-6">
    <div class="p-3 bg-indigo-100 text-indigo-600 rounded-lg">
      <i class="fa-solid fa-boxes-stacked text-xl"></i>
    </div>
    <div>
      <h3 class="text-xl font-bold text-gray-800">Enregistrer un Mouvement</h3>
      <p class="text-sm text-gray-500">Mise à jour du solde de stock</p>
    </div>
  </div>

  <!-- Message d'erreur local -->
  <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-100 text-red-700 rounded-lg text-sm flex items-center gap-2">
    <i class="fa-solid fa-triangle-exclamation"></i>
    <span>{{ errorMessage }}</span>
  </div>

  <!-- Information Article -->
  <div *ngIf="article" class="bg-gray-50 border border-gray-200 rounded-lg p-4 mb-6 grid grid-cols-2 gap-4">
    <div>
      <span class="text-xs text-gray-500 uppercase font-semibold">Code Article</span>
      <p class="text-sm font-bold text-gray-800">{{ article.code }}</p>
    </div>
    <div>
      <span class="text-xs text-gray-500 uppercase font-semibold">Désignation</span>
      <p class="text-sm font-bold text-gray-800">{{ article.nom }}</p>
    </div>
    <div class="col-span-2 border-t pt-2 mt-1 flex justify-between items-center">
      <span class="text-xs text-gray-500 uppercase font-semibold">Stock Actuel</span>
      <span class="text-base font-extrabold text-indigo-600">{{ article.quantite }} unités</span>
    </div>
  </div>

  <!-- Formulaire de Saisie -->
  <form (ngSubmit)="valider()" #mouvementForm="ngForm" class="space-y-5">

    <!-- Type de Mouvement -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Type d'opération</label>
      <div class="grid grid-cols-2 gap-3">
        <button
          type="button"
          (click)="setType(TypeMouvementStock.ENTREE)"
          [ngClass]="typeMouvement === TypeMouvementStock.ENTREE ? 'bg-green-600 text-white shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
          class="py-2.5 px-4 rounded-lg font-semibold flex items-center justify-center gap-2 transition-all">
          <i class="fa-solid fa-arrow-down-long"></i> Entrée
        </button>

        <button
          type="button"
          (click)="setType(TypeMouvementStock.SORTIE)"
          [ngClass]="typeMouvement === TypeMouvementStock.SORTIE ? 'bg-red-600 text-white shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'"
          class="py-2.5 px-4 rounded-lg font-semibold flex items-center justify-center gap-2 transition-all">
          <i class="fa-solid fa-arrow-up-long"></i> Sortie
        </button>
      </div>
    </div>

    <!-- Quantité -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Quantité</label>
      <input
        type="number"
        min="1"
        [(ngModel)]="quantite"
        name="quantite"
        required
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-all" />
    </div>

    <!-- Département (Masqué pour Entrée) -->
    <div *ngIf="typeMouvement === TypeMouvementStock.SORTIE">
      <label class="block text-sm font-medium text-gray-700 mb-1">Département concerné</label>
      <input
        type="text"
        [(ngModel)]="departement"
        name="departement"
        required
        placeholder="Ex: Production, Maintenance, Magasin..."
        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-all" />
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-3 pt-4 border-t">
      <button
        type="button"
        (click)="onAnnuler()"
        class="w-1/2 py-2.5 bg-gray-100 text-gray-700 font-medium rounded-lg hover:bg-gray-200 transition-colors">
        Annuler
      </button>

      <button
        type="submit"
        [disabled]="!mouvementForm.valid || isSubmitting"
        class="w-1/2 py-2.5 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 disabled:opacity-50 transition-colors shadow-sm">
        {{ isSubmitting ? 'Enregistrement...' : 'Valider' }}
      </button>
    </div>

  </form>
</div>
