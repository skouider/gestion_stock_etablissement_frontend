<div class="article-detail-page">

  <!-- Chargement -->
  <div *ngIf="loading" class="loading-card">
    <div class="spinner"></div>
    <h2>Chargement de l'article...</h2>
  </div>

  <!-- Erreur -->
  <div *ngIf="!loading && erreur" class="error-card">
    <h2>Erreur</h2>
    <p>{{ erreur }}</p>
  </div>

  <!-- Article -->
  <div *ngIf="!loading && article" class="article-card">

    <!-- Photo -->
    <div class="photo-container">
      <img
        *ngIf="imageArticleUrl && !imageError"
        [src]="imageArticleUrl"
        [alt]="article.nom"
        (error)="onImageError()" />

      <div *ngIf="!imageArticleUrl || imageError" class="photo-placeholder">
        <span>📦</span>
      </div>
    </div>

    <!-- En-tête -->
    <div class="article-header">
      <h1>{{ article.nom }}</h1>
      <span class="code-badge">{{ article.code }}</span>
    </div>

    <p *ngIf="article.description" class="description">
      {{ article.description }}
    </p>

    <!-- Stock -->
    <div class="stock-box">
      <span>Niveau actuel du stock</span>
      <div class="stock-value">
        <strong>{{ article.quantite }}</strong>
        <small>unités</small>
      </div>
    </div>

    <!-- Informations complémentaires -->
    <div class="article-info" *ngIf="article.stockNom">
      <div class="info-row">
        <span>Stock</span>
        <strong>{{ article.stockNom }}</strong>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button type="button" class="btn-primary" (click)="scannerAutreArticle()">
        Scanner un autre article
      </button>

      <button type="button" class="btn-secondary" (click)="corrigerMouvement()">
        Corriger / mouvement inverse
      </button>
    </div>

  </div>

</div>
